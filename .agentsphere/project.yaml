schemaVersion: 4
rationale: Demo webapp with stdlib http.server; api+ui+cli scenario drivers
components:
  - name: app
    path: .
    toolchain:
      image: agentsphere/sandbox-polyglot
      kind: python
    verify:
      - ruff check .
      - pytest --junitxml=.agentsphere/reports/junit.xml
    artifacts_ignore: []
definition_of_done:
  - ruff check . und pytest laufen ohne Fehler
  - GET /health antwortet auf Port 8099 (Dienst web)
network:
  needs: []
services:
  - name: web
    start: python app.py
    port: 8099
    health:
      http: /health
      timeoutSec: 30
    preview:
      path: /
